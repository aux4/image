name: Publish Package

on:
  push:
    branches:
      - main
      - dev
    paths:
      - '**'
      - '!.github/**'
      - '!README.md'
      - '!LICENSE'
      - '!.gitignore'

  workflow_dispatch:
    inputs:
      level:
        description: 'Release level (patch, minor, major)'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

concurrency:
  group: publish-package-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - uses: aux4/action@v1
        with:
          command: lint
          strict: 'true'

  test:
    needs: [lint]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install ImageMagick 7
        run: |
          sudo apt-get install -y libpng-dev libjpeg-dev libtiff-dev libwebp-dev libfreetype-dev libfontconfig1-dev ghostscript fonts-dejavu-core
          curl -fsSL https://download.imagemagick.org/archive/ImageMagick.tar.gz | tar xz
          cd ImageMagick-*
          ./configure --prefix=/usr/local --with-freetype=yes --with-fontconfig=yes
          make -j$(nproc)
          sudo make install
          sudo ldconfig

      - name: Test
        uses: aux4/test-package-action@v1

  publish:
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install aux4
        run: |
          curl -fsSL https://aux4.sh | sh
          echo "$HOME/.aux4.config/packages/aux4/aux4" >> $GITHUB_PATH

      - name: Mint hub publish token
        id: mint
        env:
          DEV_CLIENT_ID: ${{ secrets.AUX4_DEV_PUBLISHER_CLIENT_ID }}
          DEV_CLIENT_SECRET: ${{ secrets.AUX4_DEV_PUBLISHER_CLIENT_SECRET }}
          PROD_CLIENT_ID: ${{ secrets.AUX4_PUBLISHER_CLIENT_ID }}
          PROD_CLIENT_SECRET: ${{ secrets.AUX4_PUBLISHER_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          if [ "${{ github.ref_name }}" = "dev" ]; then
            SSO_URL="https://dev.sso.aux4.io/token"
            CLIENT_ID="$DEV_CLIENT_ID"; CLIENT_SECRET="$DEV_CLIENT_SECRET"
          else
            SSO_URL="https://sso.aux4.io/token"
            CLIENT_ID="$PROD_CLIENT_ID"; CLIENT_SECRET="$PROD_CLIENT_SECRET"
          fi
          if [ -z "$CLIENT_ID" ] || [ -z "$CLIENT_SECRET" ]; then
            echo "::error::publisher client id/secret not set for ${{ github.ref_name }}"
            exit 1
          fi
          TOK=$(curl -sf -u "$CLIENT_ID:$CLIENT_SECRET" -d grant_type=client_credentials "$SSO_URL" | jq -r '.access_token // empty')
          if [ -z "$TOK" ]; then echo "::error::client_credentials mint returned no access_token"; exit 1; fi
          echo "::add-mask::$TOK"; echo "token=$TOK" >> "$GITHUB_OUTPUT"

      - name: Publish package
        uses: aux4/action@v1
        with:
          command: publish
          working_directory: package
          package_directory: .
          level: ${{ inputs.level || 'patch' }}
          registry: ${{ github.ref_name == 'dev' && 'https://dev.api.hub.aux4.io/v1/packages' || '' }}
          aux4_token: ${{ steps.mint.outputs.token }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
